[project]
name = "nanokimi"
version = "0.2.0"
description = "Minimal Kimi-K2-style architecture (MuonClip, MoE, Multi-head Latent Attention) as a small-scale research testbed"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "torch>=2.4",
    "numpy>=1.24",
    "tiktoken>=0.7",
    "datasets>=2.20",
    "safetensors>=0.4",
    "huggingface-hub>=0.24",
    "transformers>=4.44",
    "simple-parsing>=0.1.5",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "wandb>=0.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nanokimi"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["E501", "E402", "E741", "F841", "F403", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: exercises torch.compile or long training; deselect with -m 'not slow'"]
