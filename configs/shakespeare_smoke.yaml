# smoke run: validates the full stack (MLA + RoPE + MuonClip + MoE) on real text before
# committing GPU time. Small enough to finish on CPU. Not a scaling-study run.
data_dir: data/processed/shakespeare
seed: 1337
device: auto
dtype: float32
compile: false
wandb_project: ""
run_name: shakespeare-smoke

model:
  n_layer: 4
  n_embd: 256
  n_head: 4
  block_size: 128
  dropout: 0.0
  bias: true
  use_moe: true
  num_experts: 8
  top_k_experts: 2
  expert_capacity: 32
  apply_expert_capacity: false
  load_balance_loss_coef: 0.01
  use_latent_attention: true
  kv_lora_rank: 256
  q_lora_rank: 768
  qk_nope_head_dim: 64
  qk_rope_head_dim: 32
  v_head_dim: 64
  rope_theta: 50000.0
  attention_bias: false

optimizer:
  learning_rate: 3.0e-3
  adamw_learning_rate: 3.0e-3
  min_lr: 3.0e-4
  momentum: 0.95
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-8
  ns_steps: 5
  rms_scale: 0.2
  nesterov: false
  qk_clip_tau: 100.0
  grad_clip: 1.0

train:
  max_tokens: 512_000
  batch_size: 8
  gradient_accumulation_steps: 1
  warmup_iters: 25
  eval_interval: 100
  eval_iters: 20
  log_interval: 25
  checkpoint_interval: 500
