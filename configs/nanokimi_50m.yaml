# nanokimi-50m: 49.9M active params (168.4M total), Chinchilla budget of 1_000_000_000 tokens at ~20 tokens/active-param.
# head_dim is 64 at every size, so the MLA dims below are identical across all four runs
# and only depth/width change. That keeps scale the only variable.
data_dir: data/processed/openwebtext
seed: 42
device: auto
dtype: bfloat16
compile: true
wandb_project: nanokimi-scaling
run_name: nanokimi-50m

model:
  n_layer: 14
  n_embd: 384
  n_head: 6
  block_size: 1024
  dropout: 0.0
  bias: true

  use_moe: true
  num_experts: 8
  top_k_experts: 2
  expert_capacity: 32
  apply_expert_capacity: false
  load_balance_loss_coef: 0.01

  use_latent_attention: true
  kv_lora_rank: 256
  q_lora_rank: 768
  qk_nope_head_dim: 64
  qk_rope_head_dim: 32
  v_head_dim: 64
  rope_theta: 50000.0
  attention_bias: false

optimizer:
  learning_rate: 2.0e-4
  adamw_learning_rate: 2.0e-4
  min_lr: 2.0e-5
  momentum: 0.95
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-8
  ns_steps: 5
  rms_scale: 0.2
  nesterov: false
  qk_clip_tau: 100.0
  grad_clip: 1.0

train:
  max_tokens: 1_000_000_000
  batch_size: 32
  gradient_accumulation_steps: 2
  warmup_iters: 300
  eval_interval: 250
  eval_iters: 100
  log_interval: 10
  checkpoint_interval: 1000
